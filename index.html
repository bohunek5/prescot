<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Baza opisów aktywnych produktów Prescot dla WAPRO, TIM, Allegro i Shoper.">
  <title>Prescot LED – Baza Opisów Produktów</title>
  <link rel="icon" href="./prescot_logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="wrap">
    <header class="page-header">
      <img class="prescot-logo" src="./prescot_logo.svg" alt="Prescot LED">
      <h1>Baza Opisów</h1>
      <p>Wygodna baza dla systemów WAPRO ERP, TIM.pl, Allegro oraz Shoper (podgląd i edycja unikalności)</p>
      <div class="cloud-state" id="cloud-state">Ładowanie aktywnych produktów z chmury…</div>
    </header>

    <div class="search-container">
      <label class="sr-only" for="search-input">Wyszukaj produkt</label>
      <input id="search-input" type="search" placeholder="Wyszukaj model, sku, EAN lub fragment opisu..." autocomplete="off">
    </div>

    <div id="loading" class="notice" role="status">Ładuję produkty, EAN-y, parametry i zachowane opisy…</div>
    <div id="error" class="notice notice-error" hidden>
      <strong>Nie udało się otworzyć bazy.</strong>
      <span>Odśwież stronę albo spróbuj ponownie za chwilę.</span>
    </div>

    <div id="app" hidden>
      <nav id="platform-tabs" class="main-tabs" aria-label="Kanał sprzedaży"></nav>
      <nav id="family-tabs" class="sub-tabs" aria-label="Rodzina produktów"></nav>

      <div class="catalog-meta">
        <p id="result-summary"></p>
        <div class="utils-bar">
          <button id="expand-all" class="utils-btn" type="button">Rozwiń wszystkie</button>
          <button id="collapse-all" class="utils-btn" type="button">Zwiń wszystkie</button>
          <button id="export-edits" class="utils-btn" type="button">Eksportuj edycje</button>
          <button id="clear-edits" class="utils-btn" type="button">Wyczyść edycje</button>
        </div>
      </div>

      <section id="product-list" class="product-list" aria-live="polite"></section>
      <nav id="pagination" class="pagination" aria-label="Strony wyników"></nav>
    </div>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
